spring.application.name=systrns-dinex
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dinex?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Goodluck@07040309}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET:change-this-secret-in-production-with-at-least-32-characters}
app.jwt.access-token-minutes=${JWT_ACCESS_MINUTES:15}
app.jwt.refresh-token-days=${JWT_REFRESH_DAYS:30}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:4200}
app.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}
app.storage-dir=${STORAGE_DIR:./data/uploads}
# Bootstrap once when explicitly enabled. Keep the password in the environment, never in source control.
app.bootstrap.super-admin.enabled=${BOOTSTRAP_SUPER_ADMIN:false}
app.bootstrap.super-admin.username=${SUPER_ADMIN_USERNAME:6381110664}
app.bootstrap.super-admin.password=${SUPER_ADMIN_PASSWORD:Goodluck@09070403}
app.tax.sgst-percent=2.5
app.tax.cgst-percent=2.5
app.mail.from=${MAIL_FROM:no-reply@dinex.local}
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=8MB

spring.jackson.default-property-inclusion=non_null
server.error.include-message=never
server.error.include-stacktrace=never

# Compress JSON responses; order boards and dashboards are large and this cuts transfer time over the proxy.
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,text/plain
